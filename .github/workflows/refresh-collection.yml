name: Refresh collection

# Rebuilds public/collection.json (dev fixture, CC0 fields only) + any missing
# public/releases/<id>.json from the Discogs API and commits them; Cloudflare Pages
# auto-deploys.
#
# Setup (one time): add the Discogs token as an Actions secret —
#   repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: DISCOGS_TOKEN   Value: your Discogs personal access token
# (This is separate from the Cloudflare Pages secret of the same name.)

# Phase 1 cold audit #25: the weekly schedule is RETIRED. The multi-user site reads
# Supabase (per-user import under each user's own OAuth token); the baked collection.json
# is a dev fixture. Manual dispatch is kept for deliberate dev-fixture refreshes only.
#
# Audit v1.25 A2 (#63): the "strip Restricted fields before committing" guard used to be
# this comment — now it is CODE, twice over: refresh_collection.py no longer fetches or
# writes price/crating/crcount/have/want at all (it exits 1 if they appear), and the
# verify step below re-checks the emitted file and fails the run BEFORE the commit step
# can push. A one-click dispatch can no longer republish priced data.
on:
  workflow_dispatch: {}         # manual "Run workflow" button ONLY — no schedule

concurrency:
  group: refresh-collection
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90         # a full get_release pass over ~1,850 records is ~35–40 min
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # E5 (#103), v1.28.0 remediation-audit: the rebase-before-push below needs a real history,
                           # not a depth-1 tip that can lack a merge base after a long run

      - name: Refresh collection.json from Discogs
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_USER: lanebecker
          # RELEASE_LIMIT: '700'   # uncomment to cap get_release calls per run
        run: python3 build/refresh_collection.py     # stdlib only — no pip install needed

      - name: "Assert the ownership export was NOT regenerated (T1 / #147 i-b)"
        run: |
          # T1 replaced public/collection.json (the real ownership export) with a synthetic dev
          # fixture; #147 (i-b) neutered this workflow's export write. Belt-and-suspenders: if
          # anything changed collection.json, FAIL before committing — the real listing must never
          # be re-published to the public repo. `git status --porcelain` catches an UNTRACKED
          # regenerated file too (audit #11); the real protection is the scoped `git add` below.
          if [ -n "$(git status --porcelain -- public/collection.json)" ]; then
            echo "::error file=public/collection.json::collection.json changed during refresh — the ownership export must NOT be regenerated/committed (T1/#147 i-b). Refusing to commit."
            exit 1
          fi
          # The refreshed release-detail files are CC0 catalog data only; assert none carry a
          # Restricted key (defense in depth — release_detail() never emits them).
          python3 - <<'EOF'
          import json, glob, sys
          bad = []
          for f in glob.glob('public/releases/*.json'):
              try:
                  d = json.load(open(f))
              except Exception as e:
                  sys.exit(f'{f}: unreadable ({e})')
              bad += [f'{f}:{k}' for k in ('price','crating','crcount','have','want') if k in d]
          if bad:
              sys.exit(f'Restricted key(s) present in release files: {bad[:10]} — refusing to commit.')
          print('OK: release files carry CC0 fields only; collection.json untouched.')
          EOF

      - name: Commit refreshed release files if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/releases
          if git diff --cached --quiet; then
            echo "No new release files — nothing to commit."
          else
            git commit -m "chore: refresh CC0 release-detail files ($(date -u +%Y-%m-%d))"
            pushed=0
            for attempt in 1 2 3; do
              git rebase --abort >/dev/null 2>&1 || true
              if ! git pull --rebase origin main; then echo "rebase failed/conflict (attempt $attempt)"; sleep 3; continue; fi
              if git push origin HEAD:main; then pushed=1; break; fi
              echo "push rejected (attempt $attempt) — retrying"; sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::could not push refreshed release files after 3 attempts."
              exit 1
            fi
          fi
