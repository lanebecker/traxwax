name: Sync version badge

# Runs whenever VERSION is pushed to main.
# Reads the new version and updates the shields.io badge URL in README.md,
# then commits the change back so the badge always matches the VERSION file.
#
# Also warns (without failing) if CHANGELOG.md was not updated in the same
# push — a gentle nudge to document what changed before shipping.
#
# To cut a release: edit VERSION and CHANGELOG.md, commit, push. That's it.
#
# Security: the VERSION file is repo content, so its bytes are treated as
# untrusted input. The value is validated against a strict semver pattern before
# use and handed to every shell via env: (referenced as "$VERSION"), NEVER
# textually interpolated into a run: script with ${{ }} — so a crafted VERSION
# (e.g. `1.5.2$(...)` or one carrying sed-special characters) cannot inject shell
# or corrupt the sed in this job, which holds contents: write. Third-party actions
# are pinned to a full commit SHA, not a floating tag.

on:
  push:
    branches: [main]
    paths:
      - VERSION

# Audit (Wave A #145/#146): serialize badge runs so two rapid VERSION pushes can't race — the
# loser's rebase would conflict and (worse) its release tag would never be created, since this
# workflow only triggers on a VERSION push and nothing retries it.
concurrency:
  group: sync-version-badge
  cancel-in-progress: false

jobs:
  sync-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # full history: the CHANGELOG diff needs the parent, AND the rebase below needs a real merge base (E5/#103)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate version
        id: ver
        # Read VERSION into a shell variable (command substitution of `cat` is
        # data, not eval) and reject anything that is not a plain semantic
        # version BEFORE it is published as a step output. The optional
        # `-<suffix>` keeps pre-release tags like 1.4.0-rc1 working while still
        # excluding every shell/sed metacharacter ($ ` ( ) | & \ / and space).
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error file=VERSION::VERSION content '${version}' is not a valid semantic version (expected e.g. 1.5.4 or 1.5.4-rc1); refusing to proceed."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Warn if CHANGELOG.md not updated
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^CHANGELOG\.md$'; then
            echo "✅ CHANGELOG.md was updated alongside VERSION — nice work."
          else
            echo "::warning file=VERSION::VERSION was bumped to ${VERSION} but CHANGELOG.md was not updated in this commit. Add a [${VERSION}] section to CHANGELOG.md so the release is documented."
          fi

      - name: Update badge URL in README
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        # The badge URL is .../badge/version-<VERSION>-blueviolet.  We anchor the
        # match between the literal "version-" prefix and the literal "-blueviolet"
        # suffix using sed's negated-class trick: `[^"<)]*` swallows anything that
        # isn't a URL terminator (quote, angle, paren).  This survives hyphenated
        # versions like "1.4.0-rc1" that the older `[^-]*` pattern truncated.
        # ${VERSION} is shell-expanded (not Actions-interpolated) and was
        # validated above, so it holds no sed delimiter / replacement specials.
        run: |
          sed -i -E \
            "s|(https://img\.shields\.io/badge/version-)[^\"<)]*(-blueviolet)|\1${VERSION}\2|g" \
            README.md

      - name: Assert badge substitution landed
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        # A2 (#145): if the badge markup ever drifts (renamed / recolored / removed) the sed above
        # matches NOTHING, and the old "commit only if changed" logic then went GREEN with a stale
        # badge. Fail RED instead — the target literal MUST be present.
        run: |
          if ! grep -q "version-${VERSION}-blueviolet" README.md; then
            echo "::error file=README.md::badge literal 'version-${VERSION}-blueviolet' absent after sed — the badge markup drifted; fix the sed pattern above."
            exit 1
          fi

      - name: Commit badge, then tag the release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --- Badge sync (cosmetic): best-effort, decoupled from tagging (audit #5). ---
          badge_ok=1
          git add README.md
          if git diff --cached --quiet; then
            echo "Badge already current — nothing to commit."
          else
            git commit -m "chore: sync version badge to ${VERSION}"
            badge_ok=0
            # A2 (#145) + audit #7: rebase+push with a bounded retry, so a concurrent push from ANY
            # workflow landing mid-window doesn't fail non-fast-forward. `git rebase --abort` at the
            # top clears any half-finished rebase a prior attempt's CONFLICT left behind (audit #5),
            # so one bad attempt can't poison the rest.
            for attempt in 1 2 3; do
              git rebase --abort >/dev/null 2>&1 || true
              if ! git pull --rebase origin main; then echo "rebase failed/conflict (attempt $attempt)"; sleep 3; continue; fi
              if git push origin HEAD:main; then badge_ok=1; break; fi
              echo "push rejected (attempt $attempt) — retrying"; sleep 3
            done
            [ "$badge_ok" = "1" ] || echo "::warning::badge sync could not be pushed after 3 attempts (a concurrent README edit?) — the release TAG below is unaffected; re-run this workflow to retry the badge."
          fi
          # --- Release tag (#146): decoupled from the badge push (audit #5) so a badge conflict
          # never leaves a release untagged. Tag ORIGIN/main after a fetch, ONLY if it carries THIS
          # VERSION (a newer release racing ahead -> skip; the newer run tags its own commit -
          # audit #3). Idempotent against ORIGIN so a re-run without local tags never recreates a
          # published tag (audit #7). ---
          git fetch origin main --quiet
          origin_version="$(git show origin/main:VERSION | tr -d '[:space:]')"
          if [ "$origin_version" != "${VERSION}" ]; then
            echo "::warning::origin/main carries VERSION ${origin_version}, not ${VERSION} (a newer release raced ahead) — skipping the v${VERSION} tag; the ${origin_version} run tags its own commit."
          elif git ls-remote --exit-code origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists on origin — leaving it untouched."
          else
            git tag -a "v${VERSION}" origin/main -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi
          # Surface a failed badge sync AFTER the tag is safely handled, so the run goes RED (Lane
          # re-runs for the badge) without ever having blocked the tag.
          [ "$badge_ok" = "1" ] || { echo "::error::badge sync failed (see warning above); the v${VERSION} tag was handled independently."; exit 1; }
