<!-- Umami Cloud analytics (Hobby, free). Cookieless, no PII, no consent banner needed.
     REPLACE data-website-id with the ID from your Umami dashboard (Websites → your site →
     Edit → Website ID), and confirm the src host matches the snippet it shows (Cloud may
     serve us./eu. regional hosts). The tracker no-ops until a real ID is set. -->
<script>
  /* TraxWax privacy guard (defense in depth with data-exclude-search/hash on the tag below).
     Auto-pageviews would otherwise ship identifying/capability tokens to a third party:
       · /app/<discogs-username>  → owner/friend handle           (masked here)
       · /i/<invite-code>         → a friend-invite capability token (masked here)
       · ?connect=… query · #twcode=… fragment → stripped HERE (both url + referrer) and, for the
         url, again by data-exclude-search/hash on the tag (belt-and-suspenders; the tag attrs are
         not relied on for the referrer field).
     Applied to url AND internal referrer, so the funnel (/ , /app) stays intact. Restricted
     Discogs data never reaches analytics regardless — custom events carry actions/counts only. */
  window.twUmamiBeforeSend = function (type, payload) {
    try {
      var mask = function (u) {
        if (typeof u !== 'string') return u;
        return u.replace(/[?#].*$/, '')                     // drop query + fragment (?connect, #twcode)
                .replace(/\/app\/[^/?#]+/g, '/app/:user')   // owner/friend handle
                .replace(/\/i\/[^/?#]+/g, '/i/:code');       // invite capability token
      };
      if (payload) {
        if (payload.url) payload.url = mask(payload.url);
        if (payload.referrer) payload.referrer = mask(payload.referrer);
      }
    } catch (e) {}
    return payload;
  };
</script>
<script defer src="https://cloud.umami.is/script.js"
  data-website-id="09b243a0-36ae-4e7b-bd61-b6ac87ab4106"

  data-do-not-track="true"
  data-exclude-search="true"
  data-exclude-hash="true"
  data-before-send="twUmamiBeforeSend"></script>
